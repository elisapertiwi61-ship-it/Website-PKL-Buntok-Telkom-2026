/* =========================
   RESIZE FOTO
========================= */

function resizeImage(file){

    return new Promise(
        (resolve,reject)=>{

            const reader =
                new FileReader();


            reader.onload =
                e=>{

                    const img =
                        new Image();


                    img.onload =
                        ()=>{

                            const max =
                                1200;


                            let width =
                                img.width;


                            let height =
                                img.height;


                            if(
                                width > max ||
                                height > max
                            ){

                                const ratio =
                                    Math.min(
                                        max / width,
                                        max / height
                                    );


                                width *=
                                    ratio;


                                height *=
                                    ratio;

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;


                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            canvas.toBlob(
                                blob=>{

                                    if(!blob){

                                        reject(
                                            new Error(
                                                "Gagal membuat foto"
                                            )
                                        );

                                        return;

                                    }


                                    resolve(
                                        blob
                                    );

                                },
                                "image/jpeg",
                                .78
                            );

                        };


                    img.onerror =
                        reject;


                    img.src =
                        e.target.result;

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}

async function getSavedActivities(){

    const {
        data,
        error
    } =
        await supabaseClient
        .from("kegiatan")
        .select("*")
        .order(
            "date",
            {
                ascending:false
            }
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Gagal mengambil kegiatan:",
            error
        );


        return [];

    }


    return data || [];

}



/* =========================
   SIMPAN KEGIATAN
========================= */

document
.getElementById(
    "adminActivityForm"
)
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const date =
            document.getElementById(
                "activityDate"
            ).value;


        const title =
            document.getElementById(
                "activityTitle"
            ).value.trim();


        const description =
            document.getElementById(
                "activityDescription"
            ).value.trim();


        const imageInput =
            document.getElementById(
                "activityImage"
            );


        if(
            !date ||
            !title ||
            !description ||
            !imageInput.files.length
        ){

            alert(
                "Lengkapi semua data terlebih dahulu."
            );


            return;

        }


        const submitButton =
            document.querySelector(
                '#adminActivityForm button[type="submit"]'
            );


        submitButton.disabled =
            true;


        submitButton.textContent =
            "⏳ Menyimpan...";


        try{


            /* =========================
               1. RESIZE FOTO
            ========================= */

            const imageBlob =
                await resizeImage(
                    imageInput.files[0]
                );



            /* =========================
               2. NAMA FILE UNIK
            ========================= */

            const fileName =
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(2,10) +
                ".jpg";


            const filePath =
                "kegiatan/" +
                fileName;



            /* =========================
               3. UPLOAD FOTO
            ========================= */

            const {
                error:uploadError
            } =
                await supabaseClient
                .storage
                .from(
                    STORAGE_BUCKET
                )
                .upload(
                    filePath,
                    imageBlob,
                    {
                        contentType:
                            "image/jpeg",

                        cacheControl:
                            "3600",

                        upsert:false
                    }
                );


            if(uploadError){

                console.error(
                    uploadError
                );


                throw new Error(
                    "Foto gagal diupload"
                );

            }



            /* =========================
               4. URL FOTO
            ========================= */

            const {
                data:publicUrlData
            } =
                supabaseClient
                .storage
                .from(
                    STORAGE_BUCKET
                )
                .getPublicUrl(
                    filePath
                );


            const imageUrl =
                publicUrlData.publicUrl;



            /* =========================
               5. SIMPAN KE DATABASE
            ========================= */

            const {
                error:databaseError
            } =
                await supabaseClient
                .from("kegiatan")
                .insert([
                    {
                        date:date,

                        title:title,

                        description:description,

                        image:imageUrl
                    }
                ]);


            if(databaseError){

                console.error(
                    databaseError
                );


                /* Hapus foto
                   jika database gagal */

                await supabaseClient
                    .storage
                    .from(
                        STORAGE_BUCKET
                    )
                    .remove([
                        filePath
                    ]);


                throw new Error(
                    "Data gagal disimpan"
                );

            }



            /* =========================
               6. BERHASIL
            ========================= */

            resetAdminForm();


            await renderAdminList();


            alert(
                "✅ Kegiatan berhasil disimpan!\n\nData dan foto sudah tersimpan online."
            );


        }catch(error){

            console.error(
                error
            );


            alert(
                "❌ Kegiatan gagal disimpan.\n\nPeriksa koneksi internet dan pengaturan Supabase."
            );


        }finally{

            submitButton.disabled =
                false;


            submitButton.textContent =
                "💾 Simpan Kegiatan";

        }

    }
);



/* =========================
   RESET FORM
========================= */

function resetAdminForm(){

    document
    .getElementById(
        "adminActivityForm"
    )
    .reset();

}



/* =========================
   TAMPILKAN DATA ADMIN
========================= */

async function renderAdminList(){

    const container =
        document.getElementById(
            "adminActivityList"
        );


    container.innerHTML =
        '<p style="color:#777;text-align:center;margin-top:15px">⏳ Memuat kegiatan...</p>';


    const data =
        await getSavedActivities();


    if(!data.length){

        container.innerHTML =
            '<p style="color:#777;text-align:center;margin-top:15px">Belum ada kegiatan tambahan.</p>';


        return;

    }


    container.innerHTML =
        "";


    data.forEach(
        activity=>{

            container.innerHTML += `

                <div class="admin-item">

                    <div>

                        <strong>
                            ${escapeHtml(
                                activity.title
                            )}
                        </strong>

                        <br>

                        <small>
                            ${formatDate(
                                activity.date
                            )}
                        </small>

                    </div>


                    <button
                        class="delete-btn"
                        onclick="deleteActivity('${activity.id}')"
                    >
                        🗑 Hapus
                    </button>

                </div>

            `;

        }
    );

}



/* =========================
   AMBIL PATH FOTO
========================= */

function getStoragePathFromUrl(url){

    if(!url){

        return null;

    }


    const marker =
        "/storage/v1/object/public/" +
        STORAGE_BUCKET +
        "/";


    const position =
        url.indexOf(
            marker
        );


    if(position === -1){

        return null;

    }


    return decodeURIComponent(
        url.substring(
            position +
            marker.length
        )
    );

}



/* =========================
   HAPUS KEGIATAN
========================= */

async function deleteActivity(id){

    if(
        !confirm(
            "Yakin ingin menghapus kegiatan ini?"
        )
    ){

        return;

    }


    try{


        /* =========================
           1. AMBIL DATA
        ========================= */

        const {
            data:activity,
            error:findError
        } =
            await supabaseClient
            .from("kegiatan")
            .select("*")
            .eq(
                "id",
                id
            )
            .single();


        if(findError){

            console.error(
                findError
            );


            throw new Error(
                "Data kegiatan tidak ditemukan"
            );

        }



        /* =========================
           2. CARI PATH FOTO
        ========================= */

        const filePath =
            getStoragePathFromUrl(
                activity.image
            );



        /* =========================
           3. HAPUS FOTO
        ========================= */

        if(filePath){

            const {
                error:storageError
            } =
                await supabaseClient
                .storage
                .from(
                    STORAGE_BUCKET
                )
                .remove([
                    filePath
                ]);


            if(storageError){

                console.warn(
                    "Foto gagal dihapus:",
                    storageError
                );

            }

        }



        /* =========================
           4. HAPUS DATABASE
        ========================= */

        const {
            error:deleteError
        } =
            await supabaseClient
            .from("kegiatan")
            .delete()
            .eq(
                "id",
                id
            );


        if(deleteError){

            console.error(
                deleteError
            );


            throw new Error(
                "Data gagal dihapus"
            );

        }



        /* =========================
           5. REFRESH LIST
        ========================= */

        await renderAdminList();


        alert(
            "✅ Kegiatan berhasil dihapus."
        );


    }catch(error){

        console.error(
            error
        );


        alert(
            "❌ Kegiatan gagal dihapus."
        );

    }

}



/* =========================
   JALANKAN
========================= */

renderAdminList();

</script>
